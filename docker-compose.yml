version: "3.9"

services:
  chromadb:
    image: chromadb/chroma:1.0
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - API_HOST=0.0.0.0
      - API_KEYS=${API_KEYS:?set API_KEYS in .env before docker compose up}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - CHROMA_DB_URL=http://chromadb:8000
      - CORS_ORIGIN=http://localhost:5173
      - LOG_LEVEL=info
    depends_on:
      chromadb:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./memory:/app/memory
      - ./corpus:/app/corpus:ro
    restart: unless-stopped

volumes:
  chroma_data:
